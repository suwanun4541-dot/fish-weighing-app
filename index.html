<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>บันทึกการชั่งลูกปลา & ปลาตาย - บูรณ์ชัยกรุ๊ป</title>
  
  <!-- โหลดฟอนต์ภาษาไทย Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- โหลด React และ Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #F4F8F6; }
    canvas { touch-action: none; }

    @media print {
      body * { visibility: hidden; }
      .fw-print-sheet, .fw-print-sheet * { visibility: visible !important; }
      .fw-print-sheet {
        position: absolute; left: 0; top: 0; width: 100% !important; max-width: 100% !important;
        margin: 0 !important; padding: 10px !important; box-shadow: none !important;
        border: none !important; background: #fff !important;
      }
      .no-print { display: none !important; }
      /* บังคับพิมพ์สีพื้นหลัง */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- ส่วนของไอคอน ---
    const IconSave = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
    const IconHistory = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>;
    const IconClipboardList = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>;
    const IconPlus = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconMinus = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash2 = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const IconX = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const IconRefreshCcw = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>;
    const IconPrinter = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
    const IconArrowRight = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const IconArrowLeft = ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;
    const IconFish = ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-3.44 6-7 6-3.56 0-7.56-2.54-8.5-6Z"></path><path d="M18 12v.01"></path><path d="M11.5 10.5c-1 0-2 1-2 2s1 2 2 2"></path><path d="M6.5 12c-2.3 0-3.5 1-4.5-2C1 9 1 7 1 7s2 0 3 1c1 1 2.2 2 2.5 4Z"></path><path d="M6.5 12c-2.3 0-3.5 1-4.5 2C1 15 1 17 1 17s2 0 3-1c1-1 2.2-2 2.5-4Z"></path></svg>;
    const IconBook = ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><path d="M8 7h6"></path><path d="M8 11h8"></path></svg>;
    const IconLock = ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const IconSkull = ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="M12.5 17l-.5-1-.5 1h1z"></path><path d="M6 20c-1.5-1.5-3-4-3-8a9 9 0 0 1 18 0c0 4-1.5 6.5-3 8"></path></svg>;

    // -----------------------------------------------------------------------------
    // URL Web App
    // -----------------------------------------------------------------------------
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwFI0rr2UjhYey67NiXR9K_1NAihlmQjwUkXl_pCJbVMoQfxtSijhEhGGmFszyr1oki/exec"; 

    const storage = {
      get: async (key) => {
        try {
          const res = await fetch(`${GOOGLE_SHEET_API_URL}?action=get&key=${encodeURIComponent(key)}`);
          const data = await res.json();
          return { value: data.value };
        } catch (e) {
          return { value: localStorage.getItem(key) };
        }
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors', // ป้องกันเบราว์เซอร์บล็อก
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'set', key, value })
          });
        } catch (e) {}
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors', // ป้องกันเบราว์เซอร์บล็อก
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', key })
          });
        } catch (e) {}
      }
    };

    const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const uid = () => Math.random().toString(36).slice(2, 9);

    const todayDefaults = () => {
      const d = new Date();
      return { day: String(d.getDate()), month: THAI_MONTHS[d.getMonth()], year: String(d.getFullYear() + 543) };
    };

    const num = (v) => {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    };

    const fmt = (v, digits = 2) => {
      const n = num(v);
      if (!Number.isFinite(n)) return "0";
      return n.toLocaleString("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: digits });
    };

    // Data Models สำหรับชั่งปลา
    const newBucket = () => ({ id: uid(), weight: "" });
    const newSet = (index) => ({ 
      id: uid(), pond: "", batch: "", sizeGram: "", transportName: "", plate: "", farmerSig: "", transportSig: "", showSignature: false, ...todayDefaults(), buckets: [newBucket()] 
    });
    const emptyState = () => ({
      farm: { address1: "", address2: "", batch: "", branch: "" },
      sample: { counted: "", weighedKg: "" },
      waterPerBucketKg: "5", deductPercent: "2", note: "", sets: [newSet(1)],
    });

    // Data Model สำหรับปลาตาย
    const emptyMortalityEntry = () => ({ pond: "", batch: "", deadCount: "", note: "", ...todayDefaults() });

    const calcSet = (set, waterPerBucketKg, deductPercent) => {
      const gross = (set.buckets || []).reduce((s, b) => s + num(b.weight), 0);
      const bucketCount = (set.buckets || []).filter((b) => num(b.weight) > 0).length;
      const waterDeducted = bucketCount * num(waterPerBucketKg);
      const afterBucketWater = Math.max(0, gross - waterDeducted);
      const net = afterBucketWater * (1 - num(deductPercent) / 100);
      const size = num(set.sizeGram);
      const fishCount = size > 0 ? (net * 1000) / size : 0;
      return { gross, bucketCount, waterDeducted, afterBucketWater, net, fishCount };
    };

    const setLabel = (set) => {
      if (set.pond || set.batch) return `บ่อ/กระชัง ${set.pond || "-"}${set.batch ? " รุ่น " + set.batch : ""}`;
      return "ใบชั่งใหม่";
    };

    const SignaturePad = ({ label, value, onChange }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const hasLoaded = useRef(false); 

      useEffect(() => {
        if (value && canvasRef.current && !hasLoaded.current) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          const img = new Image();
          img.onload = () => { ctx.drawImage(img, 0, 0); };
          img.src = value;
          hasLoaded.current = true;
        }
      }, [value]);

      const start = (e) => { setIsDrawing(true); draw(e); };
      const stop = () => {
        setIsDrawing(false);
        if (canvasRef.current) {
          canvasRef.current.getContext('2d').beginPath();
          onChange(canvasRef.current.toDataURL('image/png'));
        }
      };
      
      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#16302B";
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
      };

      const clear = (e) => {
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasLoaded.current = false;
        onChange(""); 
      };

      return (
        <div style={{ border: "1px solid var(--border)", borderRadius: 10, background: "#fff", padding: "8px 8px 12px", position: 'relative' }}>
          <div style={{ fontSize: 12, color: "var(--ink-soft)", marginBottom: 6, fontWeight: 600 }}>{label}</div>
          <canvas ref={canvasRef} width={200} height={100} style={{ width: '100%', height: '80px', border: '1px dashed var(--border)', borderRadius: 6, background: 'var(--bg)' }} onPointerDown={start} onPointerMove={draw} onPointerUp={stop} onPointerOut={stop} />
          <button onClick={clear} style={{ position: 'absolute', top: 6, right: 8, fontSize: 11, background: 'none', border: 'none', color: 'var(--danger)', cursor: 'pointer' }}>ล้าง</button>
          <div style={{ borderBottom: '1px solid var(--ink)', width: '80%', margin: '14px auto 0', opacity: 0.3 }}></div>
        </div>
      );
    };

    function AppCore() {
      // States สำหรับชั่งปลา
      const [state, setState] = useState(emptyState());
      const [activeIdx, setActiveIdx] = useState(0);
      const [records, setRecords] = useState([]);
      const [selectedPrint, setSelectedPrint] = useState({});
      const [viewReport, setViewReport] = useState(null);

      // States สำหรับปลาตาย
      const [mortalityEntry, setMortalityEntry] = useState(emptyMortalityEntry());
      const [mortalityRecords, setMortalityRecords] = useState([]);
      const [filterPond, setFilterPond] = useState("");
      const [viewMortalityReport, setViewMortalityReport] = useState(null);
      
      // States รวมระบบ
      const [mainTab, setMainTab] = useState('home'); // 'home', 'sample', 'weighing', 'mortality'
      const [showHistory, setShowHistory] = useState(false);
      const [showDaily, setShowDaily] = useState(false);
      const [showMortalityHistory, setShowMortalityHistory] = useState(false);
      const [status, setStatus] = useState("");
      const [loaded, setLoaded] = useState(false);
      const saveTimer = useRef(null);

      const { farm, sample, waterPerBucketKg, deductPercent, note, sets } = state;

      const update = (patch) => setState((s) => ({ ...s, ...patch }));
      const updateFarm = (patch) => setState((s) => ({ ...s, farm: { ...s.farm, ...patch } }));
      const updateSample = (patch) => setState((s) => ({ ...s, sample: { ...s.sample, ...patch } }));
      const patchMortality = (p) => setMortalityEntry((s) => ({ ...s, ...p }));

      // อัพเดท Print Select
      useEffect(() => {
        const initialSelect = {};
        records.forEach(r => {
          (r.sets || []).forEach(s => {
            initialSelect[s.id] = true;
          });
        });
        setSelectedPrint(initialSelect);
      }, [records]);

      const togglePrintSelect = (id) => setSelectedPrint(prev => ({ ...prev, [id]: !prev[id] }));
      const togglePrintSelectAll = (groupSets, isSelected) => {
        const next = { ...selectedPrint };
        groupSets.forEach(s => next[s.id] = isSelected);
        setSelectedPrint(next);
      };

      // Auto Save Session (หน้าชั่งปลา)
      useEffect(() => {
        (async () => {
          try {
            const r = await storage.get("session:current");
            if (r && r.value) setState((s) => ({ ...s, ...JSON.parse(r.value) }));
          } catch (e) {}
          setLoaded(true);
        })();
      }, []);

      useEffect(() => {
        if (!loaded) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try { await storage.set("session:current", JSON.stringify(state)); } catch (e) {}
        }, 800);
        return () => clearTimeout(saveTimer.current);
      }, [state, loaded]);

      // โหลดประวัติทั้งหมด
      const loadRecords = useCallback(async () => {
        try {
          const idx = await storage.get("records:index");
          const list = idx && idx.value ? JSON.parse(idx.value) : [];
          setRecords(list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));
        } catch (e) { setRecords([]); }
        
        try {
          const mIdx = await storage.get("mortality:records:index");
          const mList = mIdx && mIdx.value ? JSON.parse(mIdx.value) : [];
          setMortalityRecords(mList.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));
        } catch (e) { setMortalityRecords([]); }
      }, []);

      useEffect(() => { 
        if (showHistory || showDaily || showMortalityHistory || mainTab === 'mortality') {
          loadRecords(); 
        }
      }, [showHistory, showDaily, showMortalityHistory, mainTab, loadRecords]);

      // --- ฟังก์ชันชั่งปลา ---
      const sampleNetKg = Math.max(0, num(sample.weighedKg) - num(waterPerBucketKg));
      const perFishGram = sample.counted && sampleNetKg > 0 ? (sampleNetKg * 1000) / num(sample.counted) : 0;

      const allCalc = sets.map((s) => calcSet(s, waterPerBucketKg, deductPercent));
      const grandNetKg = allCalc.reduce((s, c) => s + c.net, 0);
      const grandFishCount = allCalc.reduce((s, c) => s + c.fishCount, 0);
      const grandBuckets = allCalc.reduce((s, c) => s + c.bucketCount, 0);

      const addSet = () => { update({ sets: [...sets, newSet(sets.length + 1)] }); setActiveIdx(sets.length); };
      const removeSet = (id) => {
        if (sets.length <= 1) return;
        const idx = sets.findIndex((s) => s.id === id);
        const next = sets.filter((s) => s.id !== id);
        update({ sets: next }); setActiveIdx(Math.max(0, Math.min(idx, next.length - 1)));
      };
      const patchSet = (id, patch) => update({ sets: sets.map((s) => (s.id === id ? { ...s, ...patch } : s)) });
      const addBucket = (setId) => update({ sets: sets.map((s) => (s.id === setId ? { ...s, buckets: [...s.buckets, newBucket()] } : s)) });
      const removeBucket = (setId, bucketId) => {
        update({ sets: sets.map((s) => s.id === setId ? { ...s, buckets: s.buckets.length > 1 ? s.buckets.filter((b) => b.id !== bucketId) : s.buckets } : s ) });
      };
      const patchBucket = (setId, bucketId, weight) => update({ sets: sets.map((s) => s.id === setId ? { ...s, buckets: s.buckets.map((b) => (b.id === bucketId ? { ...b, weight } : b)) } : s ) });

      const saveWeighingRecord = async () => {
        try {
          setStatus("กำลังบันทึกใบชั่งปลา...");
          const id = uid();
          const label = `บันทึกเวลา ${new Date().toLocaleTimeString("th-TH", {hour: '2-digit', minute:'2-digit'})}`;
          const totalNetKg = allCalc.reduce((sum, c) => sum + c.net, 0);
          const totalFishCount = allCalc.reduce((sum, c) => sum + c.fishCount, 0);

          await storage.set(`records:${id}`, JSON.stringify(state));
          const idxRes = await storage.get("records:index").catch(() => null);
          const list = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
          
          list.push({ key: id, label, savedAt: Date.now(), farm, sets: sets, totalNetKg, totalFishCount, waterPerBucketKg, deductPercent, note });
          await storage.set("records:index", JSON.stringify(list));

          if (GOOGLE_SHEET_API_URL && GOOGLE_SHEET_API_URL.length > 10) {
            const rowsToSave = sets.map((s) => {
              const c = calcSet(s, waterPerBucketKg, deductPercent);
              return {
                dateStr: `${s.day || "-"} ${s.month || "-"} ${s.year || "-"}`,
                timeStr: new Date().toLocaleTimeString("th-TH", {hour: '2-digit', minute:'2-digit'}),
                branch: farm.branch || "-",
                pond: s.pond || "-",
                batch: s.batch || "-",
                transport: s.transportName || "-",
                plate: s.plate || "-",
                bucketCount: c.bucketCount,
                grossKg: c.gross,
                waterDeducted: c.waterDeducted,
                netKg: c.net,
                sizeGram: s.sizeGram || "-",
                fishCount: Math.round(c.fishCount),
                note: note || "-"
              };
            });

            fetch(GOOGLE_SHEET_API_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ rows: rowsToSave })
            }).catch(err => console.error("Sheet sync error", err));
          }
          
          setStatus("บันทึกข้อมูลเรียบร้อยแล้ว!");
          setTimeout(() => { setStatus(""); setState(emptyState()); setActiveIdx(0); setMainTab('home'); }, 1500);
        } catch (e) {
          setStatus("บันทึกไม่สำเร็จ");
          setTimeout(() => setStatus(""), 2000);
        }
      };

      const loadWeighingRecord = async (key) => {
        try {
          const r = await storage.get(`records:${key}`);
          if (r && r.value) { setState(JSON.parse(r.value)); setActiveIdx(0); setShowHistory(false); setMainTab('weighing'); }
        } catch (e) {}
      };

      const deleteWeighingRecord = async (key) => {
        try {
          await storage.delete(`records:${key}`);
          const idxRes = await storage.get("records:index").catch(() => null);
          const list = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
          const next = list.filter((r) => r.key !== key);
          await storage.set("records:index", JSON.stringify(next));
          setRecords(next);
        } catch (e) {}
      };

      const resetWeighingForm = () => {
        if (!window.confirm("เคลียร์ข้อมูลทั้งหมดเพื่อเริ่มใบชั่งใหม่?")) return;
        setState(emptyState()); setActiveIdx(0);
      };

      const allGroupedByDate = useMemo(() => {
        const map = new Map();
        const sortedRecords = [...records].reverse();

        sortedRecords.forEach(record => {
          (record.sets || []).forEach(set => {
             const dateStr = `${set.day || "-"} ${set.month || "-"} ${set.year || "-"}`;
             if (!map.has(dateStr)) {
                map.set(dateStr, { dateStr, note: record.note, farm: record.farm, sets: [] });
             }
             const group = map.get(dateStr);
             const c = calcSet(set, record.waterPerBucketKg || "5", record.deductPercent || "2");
             
             const slipNo = group.sets.length + 1; 

             group.sets.push({ 
                 ...set, 
                 slipNo,
                 grossKg: c.gross, 
                 waterDeducted: c.waterDeducted, 
                 netKg: c.net, 
                 fishCount: c.fishCount, 
                 bucketCount: c.bucketCount,
                 note: record.note,
                 farm: record.farm,
                 farmerSig: set.farmerSig || record.farmerSig,
                 transportSig: set.transportSig || record.transportSig
             });
          });
        });
        
        const groups = Array.from(map.values()).reverse();
        groups.forEach(g => {
            g.sets.reverse();
            g.totalNet = g.sets.reduce((sum, s) => sum + s.netKg, 0);
            g.totalFish = g.sets.reduce((sum, s) => sum + s.fishCount, 0);
            g.totalGross = g.sets.reduce((sum, s) => sum + s.grossKg, 0);
            g.totalBuckets = g.sets.reduce((sum, s) => sum + s.bucketCount, 0);
            g.totalWater = g.sets.reduce((sum, s) => sum + s.waterDeducted, 0);
        });

        return groups;
      }, [records]);

      const handlePrepareReport = (group) => {
        const selected = group.sets.filter(s => selectedPrint[s.id]);
        if (selected.length === 0) {
            alert("กรุณาเลือกอย่างน้อย 1 ใบชั่งเพื่อพิมพ์");
            return;
        }

        const totalGross = selected.reduce((sum, s) => sum + s.grossKg, 0);
        const totalNet = selected.reduce((sum, s) => sum + s.netKg, 0);
        const totalFish = selected.reduce((sum, s) => sum + s.fishCount, 0);
        const totalBuckets = selected.reduce((sum, s) => sum + s.bucketCount, 0);
        const totalWater = selected.reduce((sum, s) => sum + s.waterDeducted, 0);

        const sortedSelected = [...selected].sort((a,b) => a.slipNo - b.slipNo);
        const slipLabel = sortedSelected.map(s => String(s.slipNo).padStart(2, '0')).join(', ');
        
        const transportSet = new Set();
        sortedSelected.forEach(s => {
          let tName = s.transportName ? s.transportName.trim() : "";
          let tPlate = s.plate ? `(${s.plate.trim()})` : "";
          let combined = `${tName} ${tPlate}`.trim();
          if (combined) {
            transportSet.add(combined);
          }
        });
        const transportInfo = Array.from(transportSet).join(', ');

        // หาจำนวนถังที่เยอะที่สุดในบรรดาชุดที่เลือก เพื่อสร้างกริดให้เท่ากัน
        const maxBuckets = Math.max(...sortedSelected.map(s => s.buckets.filter(b => num(b.weight) > 0).length), 20);

        setViewReport({
            dateStr: group.dateStr,
            farm: selected[0].farm || group.farm,
            note: selected.find(s => s.note)?.note || group.note,
            sets: sortedSelected, 
            totalGross, totalNet, totalFish, totalBuckets, totalWater,
            farmerSig: selected.find(s => s.farmerSig)?.farmerSig || "",
            transportSig: selected.find(s => s.transportSig)?.transportSig || "",
            slipLabel, transportInfo,
            maxBuckets
        });
      };

      // --- ฟังก์ชันปลาตาย ---
      const saveMortalityRecord = async () => {
        if (!mortalityEntry.pond) { setStatus("กรุณากรอกบ่อ/กระชัง"); setTimeout(() => setStatus(""), 1800); return; }
        if (num(mortalityEntry.deadCount) <= 0) { setStatus("กรุณากรอกจำนวนปลาตาย"); setTimeout(() => setStatus(""), 1800); return; }

        try {
          setStatus("กำลังบันทึกข้อมูล...");
          const id = uid();
          const dateStr = `${mortalityEntry.day || "-"} ${mortalityEntry.month || "-"} ${mortalityEntry.year || "-"}`;
          const record = {
            key: id,
            savedAt: Date.now(),
            dateStr,
            day: mortalityEntry.day, month: mortalityEntry.month, year: mortalityEntry.year,
            pond: mortalityEntry.pond, batch: mortalityEntry.batch,
            deadCount: num(mortalityEntry.deadCount),
            note: mortalityEntry.note || "",
          };

          await storage.set(`mortality:records:${id}`, JSON.stringify(record));
          const idxRes = await storage.get("mortality:records:index").catch(() => null);
          const list = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
          list.push(record);
          await storage.set("mortality:records:index", JSON.stringify(list));
          setMortalityRecords(list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));

          if (GOOGLE_SHEET_API_URL && GOOGLE_SHEET_API_URL.length > 10) {
            fetch(GOOGLE_SHEET_API_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                type: 'mortality',
                rows: [{
                  dateStr,
                  timeStr: new Date().toLocaleTimeString("th-TH", { hour: '2-digit', minute: '2-digit' }),
                  pond: mortalityEntry.pond || "-",
                  batch: mortalityEntry.batch || "-",
                  deadCount: num(mortalityEntry.deadCount),
                  note: mortalityEntry.note || "-"
                }]
              })
            }).catch(err => console.error("Sheet sync error", err));
          }

          setStatus("บันทึกปลาตายเรียบร้อย!");
          setTimeout(() => setStatus(""), 1500);
          setMortalityEntry(emptyMortalityEntry());
        } catch (e) {
          setStatus("บันทึกไม่สำเร็จ");
          setTimeout(() => setStatus(""), 2000);
        }
      };

      const deleteMortalityRecord = async (key) => {
        try {
          await storage.delete(`mortality:records:${key}`);
          const idxRes = await storage.get("mortality:records:index").catch(() => null);
          const list = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
          const next = list.filter((r) => r.key !== key);
          await storage.set("mortality:records:index", JSON.stringify(next));
          setMortalityRecords(next.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));

      };

        const d = todayDefaults();
        return `${d.day} ${d.month} ${d.year}`;

      }, [mortalityRecords, mortalityTodayLabel]);

        const set = new Set(mortalityRecords.map(r => r.pond).filter(Boolean));
        return Array.from(set).sort();
      }, [mortalityRecords]);

        let list = mortalityRecords;
        if (filterPond) list = list.filter(r => r.pond === filterPond);
        const map = new Map();
        list.forEach(r => {
          if (!map.has(r.dateStr)) map.set(r.dateStr, []);
          map.get(r.dateStr).push(r);
        });
        return Array.from(map.entries());
      }, [mortalityRecords, filterPond]);

      const mortalitySummaryByDate = useMemo(() => {
        const dateMap = new Map();
        mortalityRecords.forEach(r => {
          if (!dateMap.has(r.dateStr)) {
            dateMap.set(r.dateStr, { dateStr: r.dateStr, savedAt: r.savedAt, groups: new Map() });

          const dayEntry = dateMap.get(r.dateStr);
          if (r.savedAt > dayEntry.savedAt) dayEntry.savedAt = r.savedAt;
          const groupKey = `${r.pond || "-"}|${r.batch || "-"}`;

          }
          const g = dayEntry.groups.get(groupKey);
          g.deadCount += num(r.deadCount);
          if (r.note) g.notes.push(r.note);
        });

        const days = Array.from(dateMap.values()).map(d => {
          const groups = Array.from(d.groups.values()).sort((a, b) => a.pond.localeCompare(b.pond, 'th'));
          const totalDead = groups.reduce((s, g) => s + g.deadCount, 0);
          return { dateStr: d.dateStr, savedAt: d.savedAt, groups, totalDead };
        });

        days.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
        return days;

                <div style={{ textAlign: 'center', marginBottom: '10px' }}>
                  <h2 style={{ margin: 0, fontSize: 21, color: '#000' }}>สรุปรายงานปลาตาย</h2>
                  <div style={{ fontSize: 15, fontWeight: 700, marginTop: 4, color: '#000' }}>บูรณ์ชัยกรุ๊ป</div>
                </div>

                {viewMortalityReport.mode === 'all' ? (
                  viewMortalityReport.days.map((day) => (
                    <div key={day.dateStr} style={{ marginBottom: 20 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: '#C1553D', padding: '6px 0', borderBottom: '2px solid #C1553D' }}>วันที่ {day.dateStr}</div>
                      <table className="mr-table">
                        <thead>
                          <tr>
                            <th style={{ textAlign: 'left' }}>บ่อ / กระชัง</th>
                            <th>รุ่น</th>
                            <th>จำนวนปลาตาย (ตัว)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {day.groups.map((g, i) => (
                            <tr key={i}>
                              <td className="mr-pond-cell">{g.pond}</td>
                              <td>{g.batch}</td>
                              <td>{fmt(g.deadCount, 0)}</td>
                            </tr>
                          ))}
                          <tr className="mr-grand-row">
                            <td colSpan="2">รวมทั้งวัน</td>
                            <td>{fmt(day.totalDead, 0)}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  ))
                ) : (
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: '#C1553D', padding: '6px 0', borderBottom: '2px solid #C1553D' }}>วันที่ {viewMortalityReport.day.dateStr}</div>
                    <table className="mr-table">
                      <thead>
                        <tr>
                          <th style={{ textAlign: 'left' }}>บ่อ / กระชัง</th>
                          <th>รุ่น</th>
                          <th>จำนวนปลาตาย (ตัว)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {viewMortalityReport.day.groups.map((g, i) => (
                          <tr key={i}>
                            <td className="mr-pond-cell">{g.pond}</td>
                            <td>{g.batch}</td>
                            <td>{fmt(g.deadCount, 0)}</td>
                          </tr>
                        ))}
                        <tr className="mr-grand-row">
                          <td colSpan="2">รวมทั้งวัน</td>
                          <td>{fmt(viewMortalityReport.day.totalDead, 0)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                )}

                <div style={{ marginTop: '20px', fontSize: '12px', textAlign: 'right', color: '#888' }}>
                  พิมพ์เมื่อ {new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' })}
                </div>
              </div>
            </div>
          )}

          {/* Modal: ใบสรุปรายงานแบบตารางแยกชุด (เหมือนรูปต้นฉบับเป๊ะ) */}
          {viewReport && (
            <div className="fw-report-overlay" onClick={() => setViewReport(null)}>
              <div className="fw-print-sheet" onClick={(e) => e.stopPropagation()}>
                <div className="no-print" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16, borderBottom: '1px solid #eee', paddingBottom: 10 }}>
                  <button onClick={() => window.print()} style={{ background: 'var(--teal-light)', color: '#fff', border: 'none', padding: '8px 16px', borderRadius: 8, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                    <IconPrinter size={16} /> สั่งพิมพ์ / บันทึกเป็น PDF
                  </button>
                  <button onClick={() => setViewReport(null)} style={{ background: '#f1f1f1', border: 'none', padding: '8px 14px', borderRadius: 8, cursor: 'pointer', fontWeight: 600 }}>
                    ปิด
                  </button>
                </div>
                
                {/* ส่วนหัวของใบชั่ง */}
                <div style={{ textAlign: 'center', position: 'relative', marginBottom: '16px' }}>
                  <h2 style={{ margin: 0, fontSize: 22, color: '#000', paddingTop: '10px' }}>ใบส่งมอบ / สรุปรายการชั่งลูกปลา</h2>
                  <div style={{ fontSize: 16, fontWeight: 700, marginTop: 4, color: '#000' }}>เกษตรกร {viewReport.farm?.address1 || "บูรณ์ชัยกรุ๊ป"}</div>
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '8px', fontSize: '13.5px', fontWeight: 700, color: '#000' }}>
                  <div>วันที่: {viewReport.dateStr}</div>
                  <div>รวมน้ำหนักทั้งหมด: {fmt(viewReport.totalNet)} กก. &nbsp;&nbsp;&nbsp; รวมจำนวนตัวทั้งหมด: {fmt(viewReport.totalFish, 0)} ตัว</div>
                  <div style={{ background: '#f5e6cc', padding: '4px 10px', border: '1px solid #d9b378', borderRadius: 4 }}>ใบชั่งที่: {viewReport.slipLabel}</div>
                </div>

                {/* ตารางแสดงผลแยกแต่ละชุดชั่ง (แบบดั้งเดิม) */}
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  <div className="pr-col-container">
                    {viewReport.sets.map((s, idx) => (
                      <div key={s.id} className="pr-col">
                        {/* Header 1 */}
                        <div className="pr-dark-head">ชุดชั่งที่ {String(s.slipNo).padStart(2, '0')}</div>
                        
                        {/* Info Rows */}
                        <div className="pr-row bg-alt"><span>บ่อ</span><span style={{fontWeight: 'bold'}}>{s.pond || "-"}</span></div>
                        <div className="pr-row"><span>ขนาด(กรัม)</span><span style={{fontWeight: 'bold'}}>{s.sizeGram ? fmt(s.sizeGram, 1) : '-'}</span></div>
                        <div className="pr-row bg-alt"><span>จำนวนตัว</span><span style={{fontWeight: 'bold'}}>{fmt(s.fishCount, 0)}</span></div>

                        {/* Header 2 */}
                        <div className="pr-dark-head" style={{borderTop: '1px solid #000'}}>ชุดการชั่ง {String(s.slipNo).padStart(2, '0')}</div>
                        <div className="pr-bucket-head">
                          <div>ลำดับถัง</div>
                          <div>น้ำหนัก (กก.)</div>
                        </div>

                        {/* Buckets List */}
                        {Array.from({ length: viewReport.maxBuckets }).map((_, bIdx) => {
                          const validBuckets = (s.buckets || []).filter(b => num(b.weight) > 0);
                          const bucket = validBuckets[bIdx];
                          return (
                            <div key={bIdx} className={`pr-bucket-row ${bIdx % 2 === 0 ? '' : 'bg-alt'}`}>
                              <div style={{fontWeight: 'bold'}}>{bIdx + 1}</div>
                              <div>{bucket ? fmt(bucket.weight) : ''}</div>
                            </div>
                          )
                        })}

                        {/* Gross Sum */}
                        <div className="pr-sum-row">
                          <div>รวม</div>
                          <div>{fmt(s.grossKg)}</div>
                        </div>

                        {/* Summary Header 3 */}
                        <div className="pr-light-head">สรุปผลชุดที่ {String(s.slipNo).padStart(2, '0')}</div>
                        <div className="pr-row"><span>บ่อ</span><span style={{fontWeight: 'bold'}}>{s.pond || "-"}</span></div>
                        <div className="pr-row bg-alt"><span>นน.ทั้งหมด</span><span style={{fontWeight: 'bold'}}>{fmt(s.grossKg)}</span></div>
                        <div className="pr-row"><span>จำนวนถัง</span><span style={{fontWeight: 'bold'}}>{s.bucketCount}</span></div>
                        <div className="pr-row bg-alt"><span>หักน้ำ</span><span style={{fontWeight: 'bold'}}>{fmt(s.waterDeducted)}</span></div>
                        <div className="pr-row"><span>นน.สุทธิ</span><span style={{fontWeight: 'bold'}}>{fmt(s.netKg)}</span></div>
                      </div>
                    ))}
                  </div>

                  {/* Grand Total Bar */}
                  <div className="pr-grand-row">
                    <div>รวมทุกชุด: {viewReport.totalBuckets} ถัง</div>
                    <div>น้ำหนักรวม {fmt(viewReport.totalGross)} กก.</div>
                    <div>หักน้ำ {fmt(viewReport.totalWater)} กก.</div>
                    <div>สุทธิ {fmt(viewReport.totalNet)} กก.</div>
                    <div>{fmt(viewReport.totalFish, 0)} ตัว</div>
                  </div>
                </div>

                {viewReport.note && (
                  <div style={{ background: '#fafafa', border: '1px solid #eee', borderRadius: 6, padding: '8px 10px', fontSize: 13, marginTop: 16 }}>
                    <strong>หมายเหตุ:</strong> {viewReport.note}
                  </div>
                )}
                
                {/* ส่วนของลายเซ็นด้านล่าง */}
                <div style={{ marginTop: '20px', fontSize: '12px', fontWeight: 'bold', textAlign: 'center', color: '#000' }}>
                   {viewReport.transportInfo && <div>รถขนส่ง: {viewReport.transportInfo}</div>}
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-around', marginTop: '45px', fontSize: '13px', fontWeight: 'bold', textAlign: 'center', color: '#000' }}>
                   <div style={{ position: 'relative', width: '250px' }}>
                      {viewReport.farmerSig && <img src={viewReport.farmerSig} style={{ position: 'absolute', bottom: '25px', left: '50%', transform: 'translateX(-50%)', height: '65px' }} />}
                      <div style={{ borderBottom: '1px dashed #000', margin: '0 auto 8px', width: '80%' }}></div>
                      <div>ลงชื่อ ......................................................</div>
                      <div style={{ marginTop: '6px' }}>( เกษตรกรผู้ส่งมอบ )</div>
                   </div>
                   <div style={{ position: 'relative', width: '250px' }}>
                      {viewReport.transportSig && <img src={viewReport.transportSig} style={{ position: 'absolute', bottom: '25px', left: '50%', transform: 'translateX(-50%)', height: '65px' }} />}
                      <div style={{ borderBottom: '1px dashed #000', margin: '0 auto 8px', width: '80%' }}></div>
                      <div>ลงชื่อ ......................................................</div>
                      <div style={{ marginTop: '6px' }}>( พนักงานขับรถ / ขนส่ง )</div>
                   </div>
                </div>

              </div>
            </div>
          )}

          {/* Drawer: ประวัติการบันทึกใบชั่งปลา */}
          {showHistory && (
            <div className="fw-drawer-overlay" onClick={() => setShowHistory(false)}>
              <div className="fw-drawer" onClick={(e) => e.stopPropagation()}>

                  <span style={{ fontWeight: 700, fontSize: 16 }}>ประวัติใบชั่งปลาในเครื่อง</span>
                  <button className="fw-icon-btn" style={{ background: "rgba(0,0,0,0.05)", color: "var(--ink)" }} onClick={() => setShowHistory(false)}>
                    <IconX size={18} />
                  </button>
                </div>
                <div style={{ overflowY: 'auto', flex: 1, paddingRight: 4 }}>
                  {records.length === 0 && <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>ยังไม่มีบันทึกที่เก็บไว้</p>}
                  {records.map((r) => (
                    <div className="fw-record-row" key={r.key}>
                      <div onClick={() => loadWeighingRecord(r.key)} style={{ cursor: "pointer", flex: 1 }}>
                        <div className="fw-record-label">{r.label}</div>
                        <div className="fw-record-meta">{fmt(r.totalNetKg)} กก. สุทธิ · {fmt(r.totalFishCount, 0)} ตัว</div>
                      </div>
                      <div className="fw-record-btns">
                        <button className="fw-icon-sm" onClick={() => deleteWeighingRecord(r.key)}><IconTrash2 size={15} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Drawer: ประวัติปลาตาย */}
          {showMortalityHistory && (
            <div className="fw-drawer-overlay" onClick={() => setShowMortalityHistory(false)}>
              <div className="fw-drawer" onClick={(e) => e.stopPropagation()}>
                <div className="fw-drawer-head">
                  <span style={{ fontWeight: 700, fontSize: 16 }}>ประวัติปลาตายในเครื่อง</span>
                  <button className="fw-icon-btn" style={{ background: "rgba(0,0,0,0.05)", color: "var(--ink)" }} onClick={() => setShowMortalityHistory(false)}>
                    <IconX size={18} />
                  </button>
                </div>

                <button
                  onClick={() => { setViewMortalityReport({ mode: 'all', days: mortalitySummaryByDate }); }}
                  disabled={mortalitySummaryByDate.length === 0}
                  style={{ width: '100%', padding: '11px', borderRadius: 10, border: 'none', background: mortalitySummaryByDate.length ? 'var(--danger)' : '#ccc', color: '#fff', fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, cursor: mortalitySummaryByDate.length ? 'pointer' : 'not-allowed', marginBottom: 14 }}
                >
                  <IconPrinter size={16} /> พิมพ์สรุปปลาตายทุกวัน
                </button>

                {pondOptions.length > 0 && (
                  <div className="fw-field" style={{ marginBottom: 14 }}>
                    <label>กรองตามบ่อ/กระชัง</label>
                    <select value={filterPond} onChange={(e) => setFilterPond(e.target.value)}>
                      <option value="">-- ทั้งหมด --</option>
                      {pondOptions.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                )}

                <div style={{ overflowY: 'auto', flex: 1, paddingRight: 4 }}>
                  {groupedMortalityByDate.length === 0 && <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>ยังไม่มีบันทึกปลาตาย</p>}
                  {groupedMortalityByDate.map(([dateStr, list]) => {
                    const dayTotal = list.reduce((s, r) => s + num(r.deadCount), 0);
                    const daySummary = mortalitySummaryByDate.find(d => d.dateStr === dateStr);
                    return (
                      <div className="fw-date-group" key={dateStr}>
                        <div className="fw-date-title">
                          <span>วันที่ {dateStr}</span>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                            รวม {fmt(dayTotal, 0)} ตัว
                            {daySummary && (
                              <button
                                onClick={() => setViewMortalityReport({ mode: 'day', day: daySummary })}
                                style={{ background: 'var(--danger)', border: 'none', color: '#fff', borderRadius: 6, width: 26, height: 26, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}
                                aria-label="พิมพ์สรุปวันนี้"
                              >
                                <IconPrinter size={13} />
                              </button>
                            )}
                          </span>
                        </div>
                        {list.map((r) => (
                          <div className="fw-record-row" key={r.key} style={{gap: 8}}>
                            <div style={{ flex: 1 }}>
                              <div className="fw-record-label">บ่อ {r.pond || "-"}{r.batch ? " รุ่น " + r.batch : ""}</div>
                              {r.note && <div className="fw-record-meta">{r.note}</div>}
                            </div>
                            <div className="fw-record-dead">{fmt(r.deadCount, 0)} ตัว</div>
                            <button className="fw-icon-sm" onClick={() => deleteMortalityRecord(r.key)}><IconTrash2 size={15} /></button>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* Drawer: สรุปยอดรวมสำหรับพิมพ์ (ชั่งปลา) */}
          {showDaily && (
            <div className="fw-drawer-overlay" onClick={() => setShowDaily(false)}>
              <div className="fw-drawer" onClick={(e) => e.stopPropagation()}>
                <div className="fw-drawer-head">
                  <span style={{ fontWeight: 700, fontSize: 16 }}>สรุปเพื่อพิมพ์รายงาน</span>
                  <button className="fw-icon-btn" style={{ background: "rgba(0,0,0,0.05)", color: "var(--ink)" }} onClick={() => setShowDaily(false)}>
                    <IconX size={18} />
                  </button>
                </div>
                
                <div style={{ overflowY: 'auto', flex: 1, paddingRight: 4 }}>
                  {allGroupedByDate.length === 0 && <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>ยังไม่มีข้อมูลใบชั่งที่บันทึกไว้</p>}
                  
                  {allGroupedByDate.map((group, idx) => {
                    const allSelected = group.sets.every(s => selectedPrint[s.id]);
                    const someSelected = group.sets.some(s => selectedPrint[s.id]);

                    return (
                      <div key={idx} style={{ marginBottom: 20, background: '#fff', border: '1px solid var(--border)', borderRadius: 12, padding: '12px' }}>
                        <div style={{ fontSize: 14.5, fontWeight: 700, color: 'var(--teal-dark)', borderBottom: '1.5px solid var(--teal-pale)', paddingBottom: 8, marginBottom: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <span>วันที่ {group.dateStr}</span>
                          <button 
                            onClick={() => handlePrepareReport(group)}
                            disabled={!someSelected}
                            style={{ background: someSelected ? 'var(--teal-light)' : '#ccc', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: 6, fontSize: 12, fontWeight: 700, cursor: someSelected ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', gap: 4 }}>
                            <IconPrinter size={13} /> พิมพ์ใบที่เลือก
                          </button>
                        </div>
                        
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, fontSize: 13, color: 'var(--ink-soft)' }}>
                          <input 
                            type="checkbox" 
                            className="fw-checkbox"
                            checked={allSelected} 
                            onChange={(e) => togglePrintSelectAll(group.sets, e.target.checked)} 
                          />
                          <label style={{ fontWeight: 600, cursor: 'pointer' }} onClick={() => togglePrintSelectAll(group.sets, !allSelected)}>เลือกทั้งหมดในวันนี้</label>
                        </div>

                        {group.sets.map((row, i) => (
                          <div className="fw-record-row" key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                            <input 
                              type="checkbox" 
                              className="fw-checkbox"
                              checked={!!selectedPrint[row.id]} 
                              onChange={() => togglePrintSelect(row.id)} 
                              style={{ flex: 'none' }}
                            />
                            <div style={{ flex: 1, cursor: 'pointer' }} onClick={() => togglePrintSelect(row.id)}>
                              <div className="fw-record-label">ใบชั่ง #{String(row.slipNo).padStart(2,'0')} - บ่อ {row.pond || "-"}{row.batch ? " รุ่น " + row.batch : ""}</div>
                              <div className="fw-record-meta">{row.transportName ? `รถ: ${row.transportName}` : ''} · {row.bucketCount} ถัง · {fmt(row.fishCount, 0)} ตัว</div>
                            </div>
                            <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--teal-dark)', flex: 'none' }}>{fmt(row.netKg)} กก.</div>
                          </div>
                        ))}

                        {(() => {
                          const selectedInGroup = group.sets.filter(s => selectedPrint[s.id]);
                          const selNet = selectedInGroup.reduce((sum, s) => sum + s.netKg, 0);
                          const selFish = selectedInGroup.reduce((sum, s) => sum + s.fishCount, 0);
                          
                          if(selectedInGroup.length > 0) {
                            return (
                              <div className="fw-record-row" style={{ borderBottom: "none", marginTop: 6, background: 'var(--teal-pale)', borderRadius: 8, padding: '8px 10px' }}>
                                <div className="fw-record-label" style={{ color: 'var(--teal-dark)' }}>รวมเฉพาะที่เลือก</div>
                                <div style={{ textAlign: "right" }}>
                                  <div style={{ fontWeight: 700, fontSize: 15, color: "var(--teal-dark)" }}>{fmt(selNet)} กก.</div>
                                  <div className="fw-record-meta" style={{ color: 'var(--teal-dark)' }}>{fmt(selFish, 0)} ตัว</div>
                                </div>
                              </div>
                            )
                          }
                          return null;
                        })()}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          <div className="fw-header">
            <div className="fw-header-top">
              <div className="fw-header-left">
                {mainTab !== 'home' && (
                  <button onClick={() => setMainTab('home')} className="fw-icon-btn" style={{ marginRight: '8px' }}>
                    <IconArrowLeft size={20} />
                  </button>
                )}
                <img src="farm-logo.jpg" alt="Boonchai Logo" className="fw-logo-box" />
                <div>
                  <p className="fw-title">{mainTab === 'mortality' ? 'บันทึกปลาตาย' : 'บันทึกชั่งลูกปลา'}</p>
                  <p className="fw-subtitle">บูรณ์ชัยกรุ๊ป</p>
                </div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                {mainTab === 'weighing' && <button className="fw-icon-btn" onClick={() => setShowDaily(true)} aria-label="สรุป"><IconClipboardList size={18} /></button>}
                {mainTab === 'mortality' && <button className="fw-icon-btn" onClick={() => setViewMortalityReport({ mode: 'all', days: mortalitySummaryByDate })} aria-label="พิมพ์สรุป"><IconPrinter size={18} /></button>}
                <button className="fw-icon-btn" onClick={() => {
                  if (mainTab === 'mortality') setShowMortalityHistory(true);
                  else setShowHistory(true);
                }} aria-label="ประวัติ"><IconHistory size={18} /></button>
              </div>
            </div>
          </div>

          {/* --- หน้าต่างเมนูหลัก (Home) --- */}
          {mainTab === 'home' && (
            <div style={{ padding: '24px 20px', display: 'flex', flexDirection: 'column', gap: '16px', marginTop: '10px' }}>
              <button 
                onClick={() => setMainTab('sample')}
                style={{ background: '#fff', border: '2px solid var(--teal-light)', borderRadius: '24px', padding: '24px 20px', display: 'flex', alignItems: 'center', gap: '16px', cursor: 'pointer', boxShadow: '0 6px 12px rgba(10,68,60,0.06)' }}
              >
                <div style={{ background: 'var(--teal-pale)', padding: '14px', borderRadius: '16px' }}><IconFish size={40} color="var(--teal-light)" /></div>
                <div style={{ textAlign: 'left' }}>
                  <div style={{ fontSize: '22px', fontWeight: 700, color: 'var(--teal-dark)' }}>สุ่มไซส์ปลา</div>
                  <div style={{ fontSize: '14px', color: 'var(--ink-soft)' }}>คำนวณน้ำหนักตัวปลาเฉลี่ย</div>
                </div>
              </button>
              
              <button 
                onClick={() => setMainTab('weighing')}
                style={{ background: 'var(--teal-light)', border: 'none', borderRadius: '24px', padding: '24px 20px', display: 'flex', alignItems: 'center', gap: '16px', cursor: 'pointer', boxShadow: '0 8px 16px rgba(126,174,83,0.3)' }}
              >
                <div style={{ background: 'rgba(255,255,255,0.2)', padding: '14px', borderRadius: '16px' }}><IconBook size={40} color="#fff" /></div>
                <div style={{ textAlign: 'left' }}>
                  <div style={{ fontSize: '22px', fontWeight: 700, color: '#fff' }}>ใบชั่งปลา</div>
                  <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.85)' }}>บันทึกและพิมพ์ใบสรุปชั่งปลา</div>
                </div>
              </button>

              <button 
                onClick={() => setMainTab('mortality')}
                style={{ background: '#fff', border: '2px solid var(--danger)', borderRadius: '24px', padding: '24px 20px', display: 'flex', alignItems: 'center', gap: '16px', cursor: 'pointer', boxShadow: '0 6px 12px rgba(193,85,61,0.08)' }}
              >
                <div style={{ background: '#FBEBD3', padding: '14px', borderRadius: '16px' }}><IconSkull size={40} color="var(--danger)" /></div>
                <div style={{ textAlign: 'left' }}>
                  <div style={{ fontSize: '22px', fontWeight: 700, color: 'var(--danger)' }}>บันทึกปลาตาย</div>
                  <div style={{ fontSize: '14px', color: '#8a5b12' }}>บันทึกยอดปลาตายประจำวัน</div>
                </div>
              </button>
            </div>
          )}

          {/* --- หน้าต่างสุ่มไซส์ปลา --- */}
          {mainTab === 'sample' && (
            <div className="fw-section" style={{ paddingBottom: '30px' }}>
              <div className="fw-card">
                <p className="fw-card-title">คำนวณน้ำหนักตัวปลาเฉลี่ย</p>
                <div className="fw-grid2">
                  <div className="fw-field"><label>นับได้ (ตัว)</label><input value={sample.counted} onChange={(e) => updateSample({ counted: e.target.value })} inputMode="numeric" placeholder="ตัวอย่าง: 128" /></div>
                  <div className="fw-field"><label>ชั่งได้ ก่อนหักน้ำ (กิโล)</label><input value={sample.weighedKg} onChange={(e) => updateSample({ weighedKg: e.target.value })} inputMode="decimal" placeholder="ตัวอย่าง: 10" /></div>
                </div>
                <div className="fw-field" style={{ maxWidth: 150 }}>
                  <label>หักน้ำ (กก.)</label>
                  <input value={waterPerBucketKg} onChange={(e) => update({ waterPerBucketKg: e.target.value })} inputMode="decimal" />
                </div>
                <div className="fw-result-box" style={{ marginTop: 12 }}>
                  <span className="fw-result-label" style={{ fontSize: 14 }}>ได้น้ำหนักเฉลี่ย:</span>
                  <span className="fw-result-value" style={{ fontSize: 24, color: 'var(--teal-light)' }}>{fmt(perFishGram)}<span className="fw-result-unit" style={{ fontSize: 14, color: 'var(--teal-dark)' }}>กรัม / ตัว</span></span>
                </div>
                <p className="fw-note" style={{ textAlign: 'center', marginTop: 12 }}>
                  (หักน้ำ {fmt(waterPerBucketKg)} กก. ออกจากน้ำหนักที่ชั่งได้ก่อนคำนวณ)
                </p>
              </div>
              
              <button 
                onClick={() => setMainTab('weighing')} 
                style={{ width: '100%', padding: '14px', borderRadius: '12px', border: '1px solid var(--teal-light)', background: '#fff', color: 'var(--teal-light)', fontSize: '15px', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', cursor: 'pointer', marginTop: '16px' }}
              >
                ไปหน้าบันทึกใบชั่งปลา <IconArrowRight size={18} />
              </button>
            </div>
          )}

          {/* --- หน้าต่างใบชั่งปลา --- */}
          {mainTab === 'weighing' && (
            <div className="fw-section">
              <div className="fw-card">
                <p className="fw-card-title">ข้อมูลฟาร์ม / สาขา</p>
                <div className="fw-field"><label>ที่อยู่จัดส่ง</label><input value={farm.address1} onChange={(e) => updateFarm({ address1: e.target.value })} placeholder="หมู่ / ตำบล" /></div>
                <div className="fw-grid2">
                  <div className="fw-field"><label>อำเภอ / จังหวัด</label><input value={farm.address2} onChange={(e) => updateFarm({ address2: e.target.value })} placeholder="อ.เมือง จ.อุตรดิตถ์" /></div>
                  <div className="fw-field"><label>สาขา</label><input value={farm.branch} onChange={(e) => updateFarm({ branch: e.target.value })} /></div>
                </div>
              </div>

              <div className="fw-card">
                <div className="fw-set-header">
                  <p className="fw-card-title" style={{ margin: 0 }}>ชุดการชั่ง</p>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div className="fw-field" style={{ margin: 0, width: 82 }}><label style={{ fontSize: 11 }}>หักน้ำ/ถัง (กก.)</label><input value={waterPerBucketKg} onChange={(e) => update({ waterPerBucketKg: e.target.value })} inputMode="decimal" /></div>
                    <div className="fw-field" style={{ margin: 0, width: 72 }}><label style={{ fontSize: 11 }}>หักเพิ่ม (%)</label><input value={deductPercent} onChange={(e) => update({ deductPercent: e.target.value })} inputMode="decimal" /></div>
                  </div>
                </div>

                <div className="fw-tabs">
                  {sets.map((s, i) => <button key={s.id} className={`fw-tab ${i === activeIdx ? "active" : ""}`} onClick={() => setActiveIdx(i)}>{setLabel(s)}</button>)}
                  <button className="fw-tab-add" onClick={addSet} aria-label="เพิ่มใบชั่ง"><IconPlus size={18} /></button>
                </div>

                {active && activeCalc && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ background: 'var(--bg)', padding: '10px 12px', borderRadius: 10, marginBottom: 12 }}>
                      <div className="fw-grid2">
                        <div className="fw-field"><label>ชื่อขนส่ง</label><input value={active.transportName || ""} onChange={(e) => patchSet(active.id, { transportName: e.target.value })} placeholder="ชื่อรถ/คนขับ" /></div>
                        <div className="fw-field"><label>ทะเบียนรถ</label><input value={active.plate || ""} onChange={(e) => patchSet(active.id, { plate: e.target.value })} placeholder="เช่น 1กข 1234" /></div>
                      </div>
                      <div className="fw-grid3">
                        <div className="fw-field"><label>วันที่</label><input value={active.day || ""} onChange={(e) => patchSet(active.id, { day: e.target.value })} inputMode="numeric" /></div>
                        <div className="fw-field"><label>เดือน</label>
                          <select value={active.month || ""} onChange={(e) => patchSet(active.id, { month: e.target.value })}>
                            {THAI_MONTHS.map((m) => <option key={m} value={m}>{m}</option>)}
                          </select>
                        </div>
                        <div className="fw-field"><label>ปี (พ.ศ.)</label><input value={active.year || ""} onChange={(e) => patchSet(active.id, { year: e.target.value })} inputMode="numeric" /></div>
                      </div>
                    </div>

                    <div className="fw-grid2">
                      <div className="fw-field"><label style={{ color: 'var(--teal-dark)', fontWeight: 700, fontSize: '13.5px' }}>บ่อ / กระชัง</label><input value={active.pond} onChange={(e) => patchSet(active.id, { pond: e.target.value })} placeholder="เช่น บ่อ 1 หรือ กระชัง 5" /></div>
                      <div className="fw-field"><label style={{ color: 'var(--teal-dark)', fontWeight: 700, fontSize: '13.5px' }}>รุ่น</label><input value={active.batch} onChange={(e) => patchSet(active.id, { batch: e.target.value })} placeholder="เช่น ป3" /></div>
                    </div>
                    <div className="fw-field"><label style={{ color: 'var(--teal-dark)', fontWeight: 700, fontSize: '13.5px' }}>ขนาดไซส์ปลา (กรัม/ตัว)</label><input value={active.sizeGram} onChange={(e) => patchSet(active.id, { sizeGram: e.target.value })} inputMode="decimal" placeholder="นำน้ำหนักเฉลี่ยมาใส่ที่นี่ เช่น 25" /></div>

                    {sets.length > 1 && <button className="fw-remove-set" onClick={() => removeSet(active.id)}><IconTrash2 size={13} /> ลบใบชั่งนี้</button>}

                    <div style={{ marginTop: 12 }}>
                      <div style={{ display: 'flex', gap: '8px', marginBottom: '6px', paddingLeft: '2px' }}>
                        <div style={{ width: '30px', textAlign: 'center', fontSize: '12px', fontWeight: 700, color: 'var(--teal-dark)' }}>ถังที่</div>
                        <div style={{ flex: 1, fontSize: '12px', fontWeight: 700, color: 'var(--teal-dark)' }}>ระบุน้ำหนักก่อนหักน้ำ (กก.)</div>
                      </div>

                      {active.buckets.map((b, i) => (
                        <div className="fw-bucket-row" key={b.id}>
                          <div className="fw-bucket-idx">{i + 1}</div>
                          <input className="fw-bucket-input" value={b.weight} onChange={(e) => patchBucket(active.id, b.id, e.target.value)} inputMode="decimal" placeholder="กรอกน้ำหนัก" />
                          <span className="fw-bucket-unit">กก.</span>
                          <button className="fw-icon-sm" onClick={() => removeBucket(active.id, b.id)} aria-label="ลบถัง"><IconMinus size={15} /></button>
                        </div>
                      ))}
                      <button className="fw-add-bucket-btn" onClick={() => addBucket(active.id)}><IconPlus size={16} /> เพิ่มถัง</button>
                    </div>

                    <div className="fw-stat-grid">
                      <div className="fw-stat"><div className="fw-stat-label">น้ำหนักรวม (ก่อนหักน้ำ)</div><div className="fw-stat-value">{fmt(activeCalc.gross)} กก.</div></div>
                      <div className="fw-stat"><div className="fw-stat-label">จำนวนถัง</div><div className="fw-stat-value">{activeCalc.bucketCount} ถัง</div></div>
                      <div className="fw-stat"><div className="fw-stat-label">น้ำหนักสุทธิ</div><div className="fw-stat-value" style={{ color: 'var(--teal-light)' }}>{fmt(activeCalc.net)} กก.</div></div>
                      <div className="fw-stat"><div className="fw-stat-label">จำนวนตัว</div><div className="fw-stat-value" style={{ color: 'var(--teal-light)' }}>{fmt(activeCalc.fishCount, 0)} ตัว</div></div>
                    </div>
                    <p className="fw-note">หักน้ำ {activeCalc.bucketCount} ถัง × {fmt(waterPerBucketKg)} กก. = {fmt(activeCalc.waterDeducted)} กก. → เหลือ {fmt(activeCalc.afterBucketWater)} กก. → หักเพิ่ม {fmt(deductPercent, 1)}% → สุทธิ {fmt(activeCalc.net)} กก.</p>

                    <div style={{ marginTop: 20, padding: '12px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '10px' }}>
                      <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontSize: '14px', color: 'var(--teal-dark)', fontWeight: 600 }}>
                        <input 
                          type="checkbox" 
                          className="fw-checkbox"
                          checked={active.showSignature || false} 
                          onChange={(e) => {
                            const patch = { showSignature: e.target.checked };
                            if (!e.target.checked) {
                              patch.farmerSig = "";
                              patch.transportSig = "";
                            }
                            patchSet(active.id, patch);
                          }}
                          style={{ margin: 0 }}
                        />
                        ต้องการแนบลายเซ็นในใบชั่งนี้
                      </label>

                      {active.showSignature && (
                        <div className="fw-grid2" style={{ marginTop: 16 }}>
                          <SignaturePad label="ลายเซ็นเกษตรกร" value={active.farmerSig} onChange={(val) => patchSet(active.id, { farmerSig: val })} />
                          <SignaturePad label="ลายเซ็นขนส่ง" value={active.transportSig} onChange={(val) => patchSet(active.id, { transportSig: val })} />
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>

              <div className="fw-card">
                <p className="fw-card-title">หมายเหตุ</p>
                <div className="fw-field"><textarea value={note || ""} onChange={(e) => update({ note: e.target.value })} placeholder="กรอกหมายเหตุเพิ่มเติม..." /></div>
              </div>

              <button className="fw-btn-primary" onClick={saveWeighingRecord}><IconSave size={20} /> บันทึกข้อมูลใบชั่งปลา</button>
              <button className="fw-btn-secondary" onClick={resetWeighingForm}><IconRefreshCcw size={14} /> เคลียร์ข้อมูลทิ้ง / เริ่มใหม่</button>
              
            </div>
          )}

          {/* --- หน้าต่างบันทึกปลาตาย --- */}
          {mainTab === 'mortality' && (
            <div className="fw-section">
              <div className="fw-today-box">
                <span className="fw-today-label">ปลาตายวันนี้ ({mortalityTodayLabel})</span>
                <span className="fw-today-value">{fmt(mortalityTodayTotal, 0)} ตัว</span>
              </div>

              <div className="fw-card">
                <p className="fw-card-title"><IconSkull size={17} color="var(--danger)" /> บันทึกปลาตาย</p>

                <div className="fw-grid3">
                  <div className="fw-field"><label>วันที่</label><input value={mortalityEntry.day || ""} onChange={(e) => patchMortality({ day: e.target.value })} inputMode="numeric" /></div>
                  <div className="fw-field"><label>เดือน</label>
                    <select value={mortalityEntry.month || ""} onChange={(e) => patchMortality({ month: e.target.value })}>
                      {THAI_MONTHS.map((m) => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div className="fw-field"><label>ปี (พ.ศ.)</label><input value={mortalityEntry.year || ""} onChange={(e) => patchMortality({ year: e.target.value })} inputMode="numeric" /></div>
                </div>

                <div className="fw-grid2">
                  <div className="fw-field"><label>บ่อ / กระชัง</label><input value={mortalityEntry.pond} onChange={(e) => patchMortality({ pond: e.target.value })} placeholder="เช่น บ่อ 1" /></div>
                  <div className="fw-field"><label>รุ่น</label><input value={mortalityEntry.batch} onChange={(e) => patchMortality({ batch: e.target.value })} placeholder="เช่น ป3" /></div>
                </div>

                <div className="fw-field">
                  <label>จำนวนปลาตาย (ตัว)</label>
                  <input className="fw-dead-input" value={mortalityEntry.deadCount} onChange={(e) => patchMortality({ deadCount: e.target.value })} inputMode="numeric" placeholder="0" />
                </div>

                <div className="fw-field">
                  <label>หมายเหตุ (ถ้ามี)</label>
                  <textarea value={mortalityEntry.note} onChange={(e) => patchMortality({ note: e.target.value })} placeholder="เช่น สาเหตุ, อาการที่พบ..." />
                </div>

                <button className="fw-btn-primary" style={{ background: 'var(--danger)' }} onClick={saveMortalityRecord}><IconSave size={20} /> บันทึกปลาตาย</button>
              </div>

              <div className="fw-card">
                <p className="fw-card-title"><IconClipboardList size={17} color="var(--teal-dark)" /> สรุปปลาตายรายวัน / รุ่น</p>
                {mortalitySummaryByDate.length === 0 && <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>ยังไม่มีข้อมูลปลาตาย</p>}
                {mortalitySummaryByDate.slice(0, 5).map((day) => (
                  <div key={day.dateStr} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <span style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--teal-dark)' }}>วันที่ {day.dateStr}</span>
                      <button
                        onClick={() => setViewMortalityReport({ mode: 'day', day })}
                        style={{ background: 'var(--danger)', border: 'none', color: '#fff', borderRadius: 8, padding: '5px 10px', fontSize: 12, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer' }}
                      >
                        <IconPrinter size={13} /> พิมพ์
                      </button>
                    </div>
                    {day.groups.map((g, i) => (
                      <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--ink-soft)', padding: '3px 0' }}>
                        <span>บ่อ {g.pond}{g.batch !== '-' ? ` รุ่น ${g.batch}` : ''}</span>
                        <span style={{ fontWeight: 700, color: 'var(--danger)' }}>{fmt(g.deadCount, 0)} ตัว</span>
                      </div>
                    ))}
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 700, color: 'var(--teal-dark)', marginTop: 4, paddingTop: 4, borderTop: '1px dashed var(--border)' }}>
                      <span>รวมทั้งวัน</span>
                      <span>{fmt(day.totalDead, 0)} ตัว</span>
                    </div>
                  </div>
                ))}
                {mortalitySummaryByDate.length > 0 && (
                  <button
                    onClick={() => setViewMortalityReport({ mode: 'all', days: mortalitySummaryByDate })}
                    style={{ width: '100%', padding: '11px', borderRadius: 10, border: '1px solid var(--danger)', background: '#fff', color: 'var(--danger)', fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, cursor: 'pointer', marginTop: 4 }}
                  >
                    <IconPrinter size={16} /> พิมพ์สรุปทุกวัน
                  </button>
                )}
              </div>
            </div>
          )}

          {mainTab === 'weighing' && (
            <div className="fw-summary-bar">
              <div className="fw-summary-item"><div className="fw-summary-label">น้ำหนักสุทธิรวม</div><div className="fw-summary-value">{fmt(grandNetKg)} กก.</div></div>
              <div className="fw-summary-item"><div className="fw-summary-label">จำนวนตัวรวม</div><div className="fw-summary-value">{fmt(grandFishCount, 0)} ตัว</div></div>
              <div className="fw-summary-item"><div className="fw-summary-label">ถังรวม</div><div className="fw-summary-value" style={{ color: '#fff' }}>{grandBuckets} ถัง</div></div>
            </div>
          )}
          
        </div>
      );
    }

    function AppWrapper() {
      const [isAuth, setIsAuth] = useState(false);
      const [pin, setPin] = useState("");
      const [error, setError] = useState("");

      useEffect(() => {
        if (sessionStorage.getItem("farm_auth") === "888") setIsAuth(true);
      }, []);

      const handleLogin = () => {
        if (pin === "888") { setIsAuth(true); sessionStorage.setItem("farm_auth", "888"); } 
        else { setError("รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่"); setPin(""); }
      };

      if (!isAuth) {
        return (
          <div className="fw-root" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: '20px', "--teal": "#090909", "--teal-dark": "#0A443C", "--teal-light": "#7EAE53", "--teal-pale": "#E8F4DA", "--bg": "#F4F8F6" }}>
             <style>{`.fw-root * { box-sizing: border-box; } .fw-root { font-family: 'Sarabun', -apple-system, sans-serif; background: var(--bg); color: #16302B; max-width: 480px; margin: 0 auto; } .pin-input { width: 100%; max-width: 250px; padding: 12px; font-size: 28px; text-align: center; border: 2px solid var(--teal-light); border-radius: 12px; margin-bottom: 16px; letter-spacing: 8px; color: var(--teal-dark); background: #fff;} .pin-input:focus { outline: none; box-shadow: 0 0 0 3px var(--teal-pale); } .pin-btn { background: var(--teal-dark); color: #fff; border: none; padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(10,68,60,0.2); transition: all 0.2s; display: flex; align-items: center; gap: 8px; } .pin-btn:active { transform: translateY(2px); }`}</style>
             <img src="farm-logo.jpg" alt="Boonchai Logo" style={{ width: '180px', borderRadius: '16px', marginBottom: '30px', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} />
             <h2 style={{ color: 'var(--teal-dark)', margin: '0 0 8px 0', fontSize: '24px' }}>เข้าสู่ระบบ</h2>
             <p style={{ color: '#5C7570', marginBottom: '24px', fontSize: '15px' }}>กรุณากรอกรหัส PIN ก่อนเข้าใช้งาน</p>
             <input type="password" inputMode="numeric" className="pin-input" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="***" onKeyDown={(e) => e.key === 'Enter' && handleLogin()} />
             {error && <p style={{ color: '#C1553D', marginTop: '0', marginBottom: '16px', fontSize: '14px', fontWeight: 600 }}>{error}</p>}
             <button className="pin-btn" onClick={handleLogin}><IconLock size={20} /> เข้าสู่ระบบ</button>
          </div>
        );
      }
      return <AppCore />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppWrapper />);
  </script>
</body>
</html>
