    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwFI0rr2UjhYey67NiXR9K_1NAihlmQjwUkXl_pCJbVMoQfxtSijhEhGGmFszyr1oki/exec";

    const storage = {
      get: async (key) => {
        try {
          const res = await fetch(`${GOOGLE_SHEET_API_URL}?action=get&key=${encodeURIComponent(key)}`);
          const data = await res.json();
          return { value: data.value };
        } catch (e) {
          return { value: localStorage.getItem(key) };
        }
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'set', key, value })
          });
        } catch (e) {}
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        try {
          await fetch(GOOGLE_SHEET_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', key })
          });
        } catch (e) {}
      }
    };

      if (!Number.isFinite(n)) return "0";

    };

          const list = idx && idx.value ? JSON.parse(idx.value) : [];
          setRecords(list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));
        } catch (e) { setRecords([]); }
        setLoaded(true);
      }, []);

      useEffect(() => { if (showHistory) loadRecords(); }, [showHistory, loadRecords]);

      const saveEntry = async () => {
        if (!entry.pond) { setStatus("กรุณากรอกบ่อ/กระชัง"); setTimeout(() => setStatus(""), 1800); return; }
        if (num(entry.deadCount) <= 0) { setStatus("กรุณากรอกจำนวนปลาตาย"); setTimeout(() => setStatus(""), 1800); return; }

        try {
          setStatus("กำลังบันทึกข้อมูล...");
          const id = uid();
          const dateStr = `${entry.day || "-"} ${entry.month || "-"} ${entry.year || "-"}`;
          const record = {
            key: id,
            savedAt: Date.now(),
            dateStr,
            day: entry.day, month: entry.month, year: entry.year,
            pond: entry.pond, batch: entry.batch,
            deadCount: num(entry.deadCount),
            note: entry.note || "",
          };

          const idxRes = await storage.get("mortality:records:index").catch(() => null);
          const list = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
          list.push(record);
          await storage.set("mortality:records:index", JSON.stringify(list));
          setRecords(list.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)));

                  pond: entry.pond || "-",
                  batch: entry.batch || "-",
                  deadCount: num(entry.deadCount),
                  note: entry.note || "-"
                }]
              })
            }).catch(err => console.error("Sheet sync error", err));
          }

          setStatus("บันทึกข้อมูลเรียบร้อยแล้ว!");
          setTimeout(() => setStatus(""), 1500);
          setEntry(emptyEntry());

          setTimeout(() => setStatus(""), 2000);
        }
      };

            <div className="fw-drawer-overlay" onClick={() => setShowHistory(false)}>
              <div className="fw-drawer" onClick={(e) => e.stopPropagation()}>
                <div className="fw-drawer-head">
                  <span style={{ fontWeight: 700, fontSize: 16 }}>ประวัติปลาตายทั้งหมด</span>
                  <button className="fw-icon-btn" style={{ background: "rgba(0,0,0,0.05)", color: "var(--ink)" }} onClick={() => setShowHistory(false)}>
                    <IconX size={18} />
                  </button>
                </div>

                {pondOptions.length > 0 && (
                  <div className="fw-field" style={{ marginBottom: 14 }}>
                    <label>กรองตามบ่อ/กระชัง</label>
                    <select value={filterPond} onChange={(e) => setFilterPond(e.target.value)}>
                      <option value="">-- ทั้งหมด --</option>
                      {pondOptions.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                )}

                <div style={{ overflowY: 'auto', flex: 1, paddingRight: 4 }}>
                  {groupedByDate.length === 0 && <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>ยังไม่มีบันทึกที่เก็บไว้</p>}
                  {groupedByDate.map(([dateStr, list]) => {
                    const dayTotal = list.reduce((s, r) => s + num(r.deadCount), 0);
                    return (
                      <div className="fw-date-group" key={dateStr}>
                        <div className="fw-date-title">
                          <span>วันที่ {dateStr}</span>
                          <span>รวม {fmt(dayTotal)} ตัว</span>
                        </div>
                        {list.map((r) => (
                          <div className="fw-record-row" key={r.key}>
                            <div style={{ flex: 1 }}>
                              <div className="fw-record-label">บ่อ {r.pond || "-"}{r.batch ? " รุ่น " + r.batch : ""}</div>
                              {r.note && <div className="fw-record-meta">{r.note}</div>}
                            </div>
                            <div className="fw-record-dead">{fmt(r.deadCount)} ตัว</div>
                            <button className="fw-icon-sm" onClick={() => deleteRecord(r.key)}><IconTrash2 size={15} /></button>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          <div className="fw-header">
            <div className="fw-header-top">
              <div className="fw-header-left">
                <img src={LOGO_DATA_URI} alt="Boonchai Logo" className="fw-logo-box" />
                <div>
                  <p className="fw-title">บันทึกปลาตายรายวัน</p>
                  <p className="fw-subtitle">บูรณ์ชัยกรุ๊ป</p>
                </div>
              </div>
              <button className="fw-icon-btn" onClick={() => setShowHistory(true)} aria-label="ประวัติ"><IconHistory size={18} /></button>
            </div>
          </div>

          <div className="fw-section">
            <div className="fw-today-box">
              <span className="fw-today-label">ปลาตายวันนี้ ({todayLabel})</span>
              <span className="fw-today-value">{fmt(todayTotal)} ตัว</span>
            </div>

            <div className="fw-card">
              <p className="fw-card-title"><IconSkull size={17} color="var(--danger)" /> บันทึกปลาตาย</p>

              <div className="fw-grid3">
                <div className="fw-field"><label>วันที่</label><input value={entry.day || ""} onChange={(e) => patch({ day: e.target.value })} inputMode="numeric" /></div>
                <div className="fw-field"><label>เดือน</label>
                  <select value={entry.month || ""} onChange={(e) => patch({ month: e.target.value })}>
                    {THAI_MONTHS.map((m) => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div className="fw-field"><label>ปี (พ.ศ.)</label><input value={entry.year || ""} onChange={(e) => patch({ year: e.target.value })} inputMode="numeric" /></div>
              </div>

              <div className="fw-grid2">
                <div className="fw-field"><label>บ่อ / กระชัง</label><input value={entry.pond} onChange={(e) => patch({ pond: e.target.value })} placeholder="เช่น บ่อ 1" /></div>
                <div className="fw-field"><label>รุ่น</label><input value={entry.batch} onChange={(e) => patch({ batch: e.target.value })} placeholder="เช่น ป3" /></div>
              </div>

              <div className="fw-field">
                <label>จำนวนปลาตาย (ตัว)</label>
                <input className="fw-dead-input" value={entry.deadCount} onChange={(e) => patch({ deadCount: e.target.value })} inputMode="numeric" placeholder="0" />
              </div>

              <div className="fw-field">
                <label>หมายเหตุ (ถ้ามี)</label>
                <textarea value={entry.note} onChange={(e) => patch({ note: e.target.value })} placeholder="เช่น สาเหตุ, อาการที่พบ..." />
              </div>

              <button className="fw-btn-primary" onClick={saveEntry}><IconSave size={20} /> บันทึกปลาตาย</button>
            </div>
          </div>
        </div>
      );
    }

    function AppWrapper() {
      const [isAuth, setIsAuth] = useState(false);
      const [pin, setPin] = useState("");
      const [error, setError] = useState("");

      useEffect(() => {
        if (sessionStorage.getItem("mortality_auth") === "888") setIsAuth(true);
      }, []);

      const handleLogin = () => {
        if (pin === "888") { setIsAuth(true); sessionStorage.setItem("mortality_auth", "888"); }
        else { setError("รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่"); setPin(""); }
      };

      if (!isAuth) {
        return (
          <div className="fw-root" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', padding: '20px', "--teal-dark": "#0A443C", "--teal-light": "#7EAE53", "--teal-pale": "#E8F4DA", "--bg": "#F4F8F6" }}>
            <style>{`.fw-root * { box-sizing: border-box; } .fw-root { font-family: 'Sarabun', -apple-system, sans-serif; background: var(--bg); color: #16302B; max-width: 480px; margin: 0 auto; } .pin-input { width: 100%; max-width: 250px; padding: 12px; font-size: 28px; text-align: center; border: 2px solid var(--teal-light); border-radius: 12px; margin-bottom: 16px; letter-spacing: 8px; color: var(--teal-dark); background: #fff;} .pin-input:focus { outline: none; box-shadow: 0 0 0 3px var(--teal-pale); } .pin-btn { background: var(--teal-dark); color: #fff; border: none; padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(10,68,60,0.2); display: flex; align-items: center; gap: 8px; } .pin-btn:active { transform: translateY(2px); }`}</style>
            <img src={LOGO_DATA_URI} alt="Boonchai Logo" style={{ width: '180px', borderRadius: '16px', marginBottom: '30px', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} />
            <h2 style={{ color: 'var(--teal-dark)', margin: '0 0 8px 0', fontSize: '24px' }}>เข้าสู่ระบบ</h2>
            <p style={{ color: '#5C7570', marginBottom: '24px', fontSize: '15px' }}>กรุณากรอกรหัส PIN ก่อนเข้าใช้งาน</p>
            <input type="password" inputMode="numeric" className="pin-input" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="***" onKeyDown={(e) => e.key === 'Enter' && handleLogin()} />
            {error && <p style={{ color: '#C1553D', marginTop: '0', marginBottom: '16px', fontSize: '14px', fontWeight: 600 }}>{error}</p>}
            <button className="pin-btn" onClick={handleLogin}><IconLock size={20} /> เข้าสู่ระบบ</button>
          </div>
        );
      }
      return <MortalityApp />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AppWrapper />);
  </script>
</body>
</html>
